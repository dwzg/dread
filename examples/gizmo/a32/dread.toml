# Gizmo 1000, ARM7-style build: DREAD's test firmware (examples/gizmo/fw), built for an ARM-state
# core. Not a real device. The tables in config/ come from the ELF (`make -C ../fw targets`).

[target]
name = "gizmo-a32"
title = "Gizmo 1000 (ARM state)"

[arch]
name = "arm"
isa = "a32"
profile = "a"

[image.main]
original = "original/gizmo.bin"
base = 0x20000
limit = 0x40000                 # 128 KiB of flash from the base
entry = 0x20000
startup = [
    {kind = "code", run = 0x40000000, size = 0x5c, stored = 0x20de4},
    {kind = "data", run = 0x4000005c, size = 0x1c, stored = 0x20e40},
    {kind = "zero", run = 0x40000078, size = 0x2c},
]

[memory]
regions = [
    {name = "flash", base = 0x0, size = 0x100000, kind = "rom"},
    {name = "ram", base = 0x40000000, size = 0x10000},
    {name = "scratch", base = 0x40100000, size = 0x20000},
]
io = [[0x80000000, 0x80010000]]
stack = {top = 0x40010000, size = 0x2000}
sentinel = 0x0fff0000
scratch = {base = 0x40100000, size = 0x20000}

[compiler]
cross = "arm-none-eabi-"
cflags = ["-march=armv4t", "-marm", "-mabi=aapcs", "-mfloat-abi=soft", "-Os", "-ffreestanding",
          "-fno-builtin", "-ffunction-sections", "-fno-common"]

# Devices for the system run (dread sysrun): gizmo's serial port (examples/gizmo/fw/gizmo.h).
[models.uart]
kind = "uart"
base = 0x80000000
data = 0x0
status = 0x4
tx_ready = 0x1
rx_ready = 0x2

[models.timer]
kind = "timer"
base = 0x80001000
irq = 0

[models.intc]
kind = "intc"
base = 0x80002000

[models.gpio]
kind = "gpio"
base = 0x80003000

[scenarios.boot]
until = {uart = "READY"}
limit = 5_000_000

[scenarios.keys]
input = [[40_000, "uart", "s"]]
until = {uart = "READY\r\nmode run volume 7"}
limit = 5_000_000

[scenarios.config]
input = [[40_000, "uart", "cvolume=3\r\n"], [200_000, "uart", "s"]]
until = {uart = "mode run volume 3"}
limit = 5_000_000
