# Gizmo 1000, i386 build: DREAD's test firmware (examples/gizmo/fw), built with the host's GCC (-m32) for
# a 32-bit x86 core in flat protected mode (integer only, not position-independent). Not a real device.
# The tables in config/ come from the ELF (`make -C ../fw targets`). The startup loads a flat GDT and an
# IDT whose gate 0x20 takes the interrupt controller's line.

[target]
name = "gizmo-i386"
title = "Gizmo 1000 (i386)"

[arch]
name = "x86"
isa = "i386"

[image.main]
original = "original/gizmo.bin"
base = 0x08000000
limit = 0x08020000              # 128 KiB of flash from the base
entry = "_start"
startup = [
    {kind = "code", run = 0x20000000, size = 0x3c, stored = 0x8000b0c},
    {kind = "data", run = 0x2000003c, size = 0x1c, stored = 0x8000b48},
    {kind = "zero", run = 0x20000060, size = 0x14c},
]

[memory]
regions = [
    {name = "flash", base = 0x08000000, size = 0x100000, kind = "rom"},
    {name = "ram", base = 0x20000000, size = 0x10000},
    {name = "scratch", base = 0x20100000, size = 0x20000},
]
io = [[0x10000000, 0x10010000]]
stack = {top = 0x20010000, size = 0x2000}
sentinel = 0x1fff0000
scratch = {base = 0x20100000, size = 0x20000}

[compiler]
cross = ""                      # the host's gcc, with -m32
cflags = ["-m32", "-march=i686", "-mno-80387", "-mno-mmx", "-mno-sse", "-fno-pic", "-fno-pie", "-Os",
          "-ffreestanding", "-fno-builtin", "-ffunction-sections", "-fno-common",
          "-fno-asynchronous-unwind-tables", "-fno-stack-protector"]

# Devices for the system run (dread sysrun): gizmo's serial port, timer, interrupt controller and GPIO
# (examples/gizmo/fw/gizmo.h, GIZMO_I386: the RV32 build's addresses). The controller's line enters at
# vector 0x20 of the IDT the startup fills (dread.arch.x86 enter_interrupt).
[models.uart]
kind = "uart"
base = 0x10000000
data = 0x0
status = 0x4
tx_ready = 0x1
rx_ready = 0x2

[models.timer]
kind = "timer"
base = 0x10001000
irq = 0

[models.intc]
kind = "intc"
base = 0x10002000

[models.gpio]
kind = "gpio"
base = 0x10003000

[scenarios.boot]
until = {uart = "READY"}
limit = 5_000_000

[scenarios.keys]
input = [[40_000, "uart", "s"]]
until = {uart = "READY\r\nmode run volume 7"}
limit = 5_000_000

[scenarios.config]
input = [[40_000, "uart", "cvolume=3\r\n"], [200_000, "uart", "s"]]
until = {uart = "mode run volume 3"}
limit = 5_000_000
