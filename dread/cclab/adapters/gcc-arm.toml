# GNU Arm Embedded GCC (arm-none-eabi-gcc) for the Cortex-M, linked without a C library: the lab's
# support file gives memcpy and the like, libgcc the runtime helpers (the driver picks the libgcc of
# the build's -mcpu and float ABI, so the link gets the build's flags too).
name = "gcc-arm"
family = "gnu"
support = true
arch = "arm"
isa = "t32"
profile = "m"
support_flags = ["-fno-builtin"]

[tools]
cc = "arm-none-eabi-gcc"
ld = "arm-none-eabi-gcc"

[commands]
version = ["{cc}", "--version"]
compile = ["{cc}", "-c", "{src}", "-o", "{obj}", "{flags}"]
link = ["{ld}", "{flags}", "{objs}", "-o", "{out}", "-T", "{script}", "-nostdlib", "{ldflags}", "-lgcc"]

[matrix.cpu]
cortex-m0 = ["-mcpu=cortex-m0", "-mthumb"]
cortex-m3 = ["-mcpu=cortex-m3", "-mthumb"]
cortex-m4 = ["-mcpu=cortex-m4", "-mthumb", "-mfloat-abi=soft"]

[matrix.opt]
O0 = ["-O0"]
Os = ["-Os"]
O2 = ["-O2"]
O3 = ["-O3"]
