# IAR C/C++ Compiler for Arm (EWARM) on Windows, run from WSL through its interop. Written from IAR's
# documented command line where IAR could not be tried: `dread cclab doctor --adapter iar-arm` says
# which step fails, and a copy of this file with the fix is used as `--adapter FILE`. Linked with
# ILINK and IAR's own library (its runtime helpers are what the probes find); the lab writes the
# ILINK configuration (.icf) for the emulator's memory map (a copy of this file may bring its own as
# `script`, see dread/cclab/adapters.py), and --keep holds every probe function.
# Keep the work directory on the Windows side (--work /mnt/c/...), where iccarm.exe sees it.
# The options as IAR's documentation for EWARM 9.70 spells them (--cpu=, --fpu=none, -O[n|l|m|h|hs|hz];
# ILINK's --config, --entry, --keep). Tried on EWARM 9.70.2 and 8.42.1 (2026-10-20): the doctor and
# every probe build through, with what this file now says (9.70.2's installation lacked the library
# ILINK chooses, so its copy named them: below).
#
# An installation without the C library ILINK chooses: ILINK picks the DLib configuration from what
# the objects declare, and the probes include no library header, so it takes "normal" (dl7M_tln.a
# for the Cortex-M3 and M4); an installation with only "full" (dl7M_tlf.a) needs a copy with
#   cflags = ["--dlib_config", "full"]
#   ldflags = ["--no_library_search", 'C:\...\lib\rt7M_tl.a', 'C:\...\lib\dl7M_tlf.a', 'C:\...\lib\m7M_tl.a']
# and, as such a list holds for every build, the hard-float build (cortex-m4f) in a copy of its own
# with the VFP math library (m7M_tlv.a). An installation without IAR's C++ library (no dlpp7M...)
# takes operator new and delete from the lab's cxx_support.c (cxx_support below; one with the
# library gets the lab's all the same: an object's definition goes before a library's).
name = "iar-arm"
guard = true
family = "iar"
windows = true
support = false
cxx_support = true        # operator new and delete, __cxa_pure_virtual of the lab's (cxx_support.c)
arch = "arm"
isa = "t32"
profile = "m"

[tools]
cc = "/mnt/c/Program Files*/IAR Systems/*/arm/bin/iccarm.exe"
ld = "/mnt/c/Program Files*/IAR Systems/*/arm/bin/ilinkarm.exe"

[commands]
version = ["{cc}", "--version"]
compile = ["{cc}", "{src}", "-o", "{obj}", "--silent", "{flags}"]
compile_cxx = ["{cc}", "{src}", "-o", "{obj}", "--silent", "--c++", "--no_exceptions", "--no_rtti", "{flags}"]   # from IAR's guide; not tried
link = ["{ld}", "{objs}", "-o", "{out}", "--config", "{script}", "--entry", "cclab_entry", "--silent", "{keep}", "{ldflags}"]
keep = ["--keep", "{symbol}"]

[matrix.cpu]
cortex-m3 = ["--cpu=Cortex-M3"]
cortex-m4 = ["--cpu=Cortex-M4", "--fpu=none"]
cortex-m4f = ["--cpu=Cortex-M4", "--fpu=VFPv4_sp"]   # the FPU's name as IAR's guide spells it; not tried

[matrix.opt]
On = ["-On"]
Ol = ["-Ol"]
Om = ["-Om"]
Oh = ["-Oh"]
Ohs = ["-Ohs"]
Ohz = ["-Ohz"]

[cpus]                    # the hard-float build runs on the emulator's Cortex-M4 (it has the FPU)
cortex-m4f = "cortex-m4"
