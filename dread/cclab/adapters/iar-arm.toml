# IAR C/C++ Compiler for Arm (EWARM) on Windows, run from WSL through its interop. Written from IAR's
# documented command line where IAR could not be tried: `dread cclab doctor --adapter iar-arm` says
# which step fails, and a copy of this file with the fix is used as `--adapter FILE`. Linked with
# ILINK and IAR's own library (its runtime helpers are what the probes find); the lab writes the
# ILINK configuration (.icf) for the emulator's memory map (a copy of this file may bring its own as
# `script`, see dread/cclab/adapters.py), and --keep holds every probe function.
# Keep the work directory on the Windows side (--work /mnt/c/...), where iccarm.exe sees it.
# The options as IAR's documentation for EWARM 9.70 spells them (--cpu=, --fpu=none, -O[n|l|m|h|hs|hz];
# ILINK's --config, --entry, --keep): checked against the documentation, not against the tools.
name = "iar-arm"
guard = true
family = "iar"
windows = true
support = false
arch = "arm"
isa = "t32"
profile = "m"

[tools]
cc = "/mnt/c/Program Files*/IAR Systems/*/arm/bin/iccarm.exe"
ld = "/mnt/c/Program Files*/IAR Systems/*/arm/bin/ilinkarm.exe"

[commands]
version = ["{cc}", "--version"]
compile = ["{cc}", "{src}", "-o", "{obj}", "--silent", "{flags}"]
link = ["{ld}", "{objs}", "-o", "{out}", "--config", "{script}", "--entry", "cclab_entry", "--silent", "{keep}", "{ldflags}"]
keep = ["--keep", "{symbol}"]

[matrix.cpu]
cortex-m3 = ["--cpu=Cortex-M3"]
cortex-m4 = ["--cpu=Cortex-M4", "--fpu=none"]
cortex-m4f = ["--cpu=Cortex-M4", "--fpu=VFPv4_sp"]   # the FPU's name as IAR's guide spells it; not tried

[matrix.opt]
On = ["-On"]
Ol = ["-Ol"]
Om = ["-Om"]
Oh = ["-Oh"]
Ohs = ["-Ohs"]
Ohz = ["-Ohz"]

[cpus]                    # the hard-float build runs on the emulator's Cortex-M4 (it has the FPU)
cortex-m4f = "cortex-m4"
