# clang's versions on RISC-V: the images' clang compiles with picolibc's headers, their GCC links
# (picolibc and libgcc of its rv32imac multilib, as virt-clang-Os does with the host's newlib). clang
# 14 and 16 know no _zicsr in -march and assemble the CSR instructions without it.

[[builds]]
name = "virt-clang14-Os"
project = "virt"
toolchain = "ubuntu-22.04"
cc = "clang"
cflags = ["--target=riscv32-unknown-elf", "-march=rv32imac", "-mabi=ilp32", "-mcmodel=medlow", "-mno-relax",
          "-isystem", "/usr/lib/picolibc/riscv64-unknown-elf/include", "-ffreestanding", "-ffunction-sections",
          "-fdata-sections", "-fno-builtin-printf", "-Os", "-g"]
ld = "riscv64-elf-gcc"
lflags = ["-march=rv32imac", "-mabi=ilp32", "-mcmodel=medlow", "--specs=picolibc.specs"]
link = ["-nostartfiles", "-Wl,--gc-sections", "-Wl,--defsym=__stack_size=350"]
dread_cflags = ["--target=riscv32-unknown-elf", "-march=rv32imac_zicsr", "-mabi=ilp32", "-mno-relax", "-ffreestanding",
                "-Os", "-ffunction-sections"]

[[builds]]
name = "virt-clang16-Os"
project = "virt"
toolchain = "debian-12"
cc = "clang"
cflags = ["--target=riscv32-unknown-elf", "-march=rv32imac", "-mabi=ilp32", "-mcmodel=medlow", "-mno-relax",
          "-isystem", "/usr/lib/picolibc/riscv64-unknown-elf/include", "-ffreestanding", "-ffunction-sections",
          "-fdata-sections", "-fno-builtin-printf", "-Os", "-g"]
ld = "riscv64-elf-gcc"
lflags = ["-march=rv32imac", "-misa-spec=2.2", "-mabi=ilp32", "-mcmodel=medlow", "--specs=picolibc.specs"]
link = ["-nostartfiles", "-Wl,--gc-sections", "-Wl,--defsym=__stack_size=350"]
