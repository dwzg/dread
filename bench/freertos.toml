toolchain = "ubuntu-24.04"
cc = "riscv64-elf-gcc"
cflags = ["-march=rv32imac_zicsr", "-mabi=ilp32", "-mcmodel=medlow", "-ffunction-sections", "-fdata-sections",
          "-fno-builtin-printf", "-Os", "-g", "--specs=picolibc.specs"]
