[target]
name = "freertos-virt"
title = "FreeRTOS full demo, RV32IMAC (QEMU virt)"

[arch]
name = "riscv"
isa = "rv32"
extensions = "imac"

[memory]
regions = [
    {name = "rom", base = 0x80000000, size = 0x80000, kind = "rom"},
    {name = "ram", base = 0x80080000, size = 0x80000},
]
io = [[0x02000000, 0x02010000], [0x0c000000, 0x0c400000], [0x10000000, 0x10001000]]
stack = {top = 0x80100000, size = 0x4000}
sentinel = 0x7fff0000
scratch = {base = 0x800e0000, size = 0x10000}

# QEMU's virt board: the NS16550 UART and the CLINT's machine timer (mtime at rate 1: about 10,000
# instructions a tick, the demo counting 25,000 mtime counts a tick)
[models.uart]
kind = "uart"
base = 0x10000000
data = 0x0
status = 0x5                            # LSR
tx_ready = 0x20                         # THRE
rx_ready = 0x1                          # DR
size = 0x8

[models.clint]
kind = "clint"
base = 0x02000000
rate = 1

# From reset: the start-up, the tasks created, the scheduler started, the first ticks
[scenarios.run]
limit = 30_000_000
'''

# The MSP430F449 demo (written for mspgcc), built with TI's msp430-elf-gcc and TI's support files
# (device headers and linker scripts, a package apart from the compiler: here in ~/.local/opt). The
# lifter has no MSP430 yet: the listing, Ghidra and noreturn are measured.
[projects.msp430]
sources = [
    "FreeRTOS/Source/tasks.c", "FreeRTOS/Source/list.c", "FreeRTOS/Source/queue.c",
    "FreeRTOS/Source/portable/MemMang/heap_1.c", "FreeRTOS/Source/portable/GCC/MSP430F449/port.c",
    "FreeRTOS/Demo/Common/Minimal/flash.c", "FreeRTOS/Demo/Common/Minimal/integer.c",
    "FreeRTOS/Demo/Common/Minimal/comtest.c", "FreeRTOS/Demo/Common/Minimal/PollQ.c",
    "FreeRTOS/Demo/msp430_GCC/main.c", "FreeRTOS/Demo/msp430_GCC/ParTest/ParTest.c",
    "FreeRTOS/Demo/msp430_GCC/serial/serial.c",
]
includes = ["FreeRTOS/Demo/msp430_GCC", "FreeRTOS/Source/include", "FreeRTOS/Demo/Common/include",
            "FreeRTOS/Source/portable/GCC/MSP430F449"]
defines = ["GCC_MSP430"]
base = 0x1100
limit = 0x8000                          # the room for C ends where the scratch begins (the vectors at
entry = "__crt0_start"                  # the top are loader data of the region above it)
vectors = 0xffe0
target = '''
[target]
name = "freertos-msp430"
title = "FreeRTOS demo, MSP430F449"

[arch]
name = "msp430"
isa = "msp430"

[memory]
# The F449: peripherals below 0x200, 2 KiB of RAM, 60 KiB of flash up to the vectors. The generated
# inputs' buffers (scratch) take 16 KiB of the erased flash between the code and the vectors: a
# 16-bit address space has no other room (dread import-elf leaves it out of the free ranges).
regions = [
    {name = "flash", base = 0x1100, size = 0x6f00, kind = "rom"},
    {name = "scratch", base = 0x8000, size = 0x4000},
    {name = "flash2", base = 0xc000, size = 0x4000, kind = "rom"},
    {name = "ram", base = 0x0200, size = 0x0800},
]
io = [[0x0000, 0x0200]]
stack = {top = 0x0a00, size = 0x0200}
sentinel = 0x0ff0
scratch = {base = 0x8000, size = 0x4000}
'''

[[projects.msp430.patches]]             # mspgcc's interrupt syntax, for TI's compiler
file = "FreeRTOS/Demo/msp430_GCC/FreeRTOSConfig.h"
old = "#include <msp430x44x.h>"
new = "#include <msp430x44x.h>\n#define interrupt( vector )    __attribute__( ( interrupt( vector ) ) )\n#define wakeup                 __attribute__( ( wakeup ) )"

[[builds]]
name = "mps2-gcc-Os"
project = "mps2"
cc = "arm-none-eabi-gcc"
cflags = ["-mthumb", "-mcpu=cortex-m3", "-mfloat-abi=soft", "-ffreestanding", "-Os", "-ffunction-sections",
          "-fdata-sections", "-g"]

# The compiler-version axis (docs/todo.md, "Compiler diversity"): the GCC -Os and clang -Os builds
# compiled and linked with distributions' packaged toolchains (bench/toolchains/), the flags as above

[[builds]]
name = "mps2-gcc4-Os"                # GCC 4.9.3
project = "mps2"
