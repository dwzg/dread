# The test suite on every push and pull request: both gizmo builds (ARM state and Cortex-M3), with
# the cross compiler from the distribution. Ghidra tests are skipped (no Ghidra on the runner).
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[test]"
      - name: Tests
        run: .venv/bin/python -m pytest -q --durations=10
