# The test suite on every push and pull request: the gizmo builds (ARM state, Cortex-M3, RV32IMC),
# with the cross compilers and LLVM from the distribution, on Ubuntu 24.04 (GCC 13, binutils 2.42,
# clang 18; RISC-V GCC 13.2) and 22.04 (GCC 10, binutils 2.38, clang 14; RISC-V GCC 10.2, binutils
# 2.35.1): DREAD meets older compilers than the host's (2026-10-20: two gaps only GCC 13 showed, a
# default only binutils 2.39 knows). Newlib for the relink test; the RISC-V GCC (Ubuntu's
# riscv64-unknown-elf-, without a C library) for the tests that compile RV32 with GCC (conftest's
# riscv_gcc: either name, the -march each version takes). Ghidra tests are skipped (no Ghidra on
# the runner); -rs lists every skip with its reason.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60       # (the suite takes about 20; a hang ran 45 minutes and more before it was cancelled)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-22.04, python: "3.11"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Cross compiler
        # The runner's mirror once sent the packages at 17 kB/s (2026-10-22: 53 MB in 53 minutes, and
        # the job's limit cancelled the tests in two of three jobs): each try is bounded, and a try that
        # fails or takes too long sends the next one to archive.ubuntu.com; stalled connections time out.
        # The bound runs inside sudo: `timeout N sudo apt-get` never stops apt-get (sudo passes on no
        # signal from its own process group), which on the same day let a try run on until the step's
        # limit failed it.
        timeout-minutes: 35
        run: |
          pkgs="gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf
                binutils-riscv64-unknown-elf clang lld llvm"
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          ok=
          for try in 1 2; do
            if sudo timeout -k 30 300 $apt update && sudo timeout -k 30 600 $apt install -y --no-install-recommends $pkgs; then
              ok=1
              break
            fi
            echo "::warning::apt try $try failed or took too long; the next goes to archive.ubuntu.com"
            sudo dpkg --configure -a || true
            for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
              fi
            done
          done
          [ -n "$ok" ]
          arm-none-eabi-gcc --version | head -1
          riscv64-unknown-elf-gcc --version | head -1
          clang --version | head -1
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[test,prove,dwarf]"
      - name: Tests
        # faulthandler_timeout: a test running over 300 s gets every thread's stack written to the log
        # (the slowest takes about 170 s there), so that a hang shows where it waits
        run: .venv/bin/python -m pytest -q -rs --durations=10 -o faulthandler_timeout=300
