# The test suite on every push and pull request: the gizmo builds (ARM state, Cortex-M3, RV32IMC),
# with the cross compilers and LLVM from the distribution, on Ubuntu 24.04 (GCC 13, binutils 2.42,
# clang 18; RISC-V GCC 13.2) and 22.04 (GCC 10, binutils 2.38, clang 14; RISC-V GCC 10.2, binutils
# 2.35.1): DREAD meets older compilers than the host's (2026-10-20: two gaps only GCC 13 showed, a
# default only binutils 2.39 knows). Newlib for the relink test; the RISC-V GCC (Ubuntu's
# riscv64-unknown-elf-, without a C library) for the tests that compile RV32 with GCC (conftest's
# riscv_gcc: either name, the -march each version takes); Synopsys' prebuilt ARC toolchain for
# gizmo-arc (cached). Ghidra tests are skipped (no Ghidra on the runner); -rs lists every skip with
# its reason.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90       # (2026-10-27: the cross compilers' install up to 11 minutes, the suite 32 to 48 on
                              # 3.11 and up to 48 on 3.13, which the 60 of before cancelled at 96 %; a hung test
                              # shows its stacks after 300 s anyway: faulthandler_timeout below)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-22.04, python: "3.11"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Cross compiler
        # The runner's mirror once sent the packages at 17 kB/s (2026-10-22: 53 MB in 53 minutes, and
        # the job's limit cancelled the tests in two of three jobs): each try is bounded, and a try that
        # fails or takes too long sends the next one to archive.ubuntu.com; stalled connections time out.
        # The bound runs inside sudo: `timeout N sudo apt-get` never stops apt-get (sudo passes on no
        # signal from its own process group), which on the same day let a try run on until the step's
        # limit failed it.
        timeout-minutes: 35
        run: |
          pkgs="gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi gcc-riscv64-unknown-elf
                binutils-riscv64-unknown-elf clang lld llvm"
          apt="apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          ok=
          for try in 1 2; do
            if sudo timeout -k 30 300 $apt update && sudo timeout -k 30 600 $apt install -y --no-install-recommends $pkgs; then
              ok=1
              break
            fi
            echo "::warning::apt try $try failed or took too long; the next goes to archive.ubuntu.com"
            sudo dpkg --configure -a || true
            for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
              if [ -f "$f" ]; then
                sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' "$f"
              fi
            done
          done
          [ -n "$ok" ]
          arm-none-eabi-gcc --version | head -1
          riscv64-unknown-elf-gcc --version | head -1
          clang --version | head -1
      - name: ARC toolchain
        # Synopsys' prebuilt ARC GNU toolchain (GCC 15.2, binutils, newlib; docs/decisions.md, "ARC
        # toolchain and the engine's check") for the ARC tests that assemble or compile (gizmo-arc's
        # listing, its rewritten functions, the system run, the engine against the host's C); they
        # skip without it. Cached by release; the archive's sha256 is checked. Put on PATH only where
        # its GCC runs on the runner.
        uses: actions/cache@v4
        with:
          path: ~/arc
          key: arc-gnu-2026.03-elf32-le-arc600
      - name: ARC toolchain on PATH
        timeout-minutes: 15
        run: |
          if [ ! -x ~/arc/gnu-2026.03/bin/arc-elf32-gcc ]; then
            mkdir -p ~/arc/dl
            url=https://github.com/foss-for-synopsys-dwc-arc-processors/toolchain/releases/download/arc-2026.03-release/arc_gnu_2026.03_prebuilt_elf32_le_linux_install.tar.xz
            curl -fsSL --retry 3 -o ~/arc/dl/arc.tar.xz "$url"
            echo "2a23341f1060dd102a064099da3cd4af0af20fd3823f92ac0b4e28e670329d8d  $HOME/arc/dl/arc.tar.xz" | sha256sum -c -
            tar -xJf ~/arc/dl/arc.tar.xz -C ~/arc
            mv ~/arc/arc_gnu_prebuilt_elf32_le_linux_install/arc-multilib-elf32 ~/arc/gnu-2026.03
            rm -rf ~/arc/dl ~/arc/arc_gnu_prebuilt_elf32_le_linux_install
            # 2.2 GB unpacked, 170 MB without newlib and the other cores' libgcc (gizmo-arc and the tests
            # link -nostdlib with the ARC600's libgcc only)
            rm -rf ~/arc/gnu-2026.03/newlib-nano ~/arc/gnu-2026.03/arc-snps-elf/lib ~/arc/gnu-2026.03/share
            for d in ~/arc/gnu-2026.03/lib/gcc/arc-snps-elf/15.2.0/*/; do
              case "$(basename "$d")" in arc600|include|include-fixed|install-tools) ;; *) rm -rf "$d" ;; esac
            done
          fi
          if ~/arc/gnu-2026.03/bin/arc-elf32-gcc --version > arc-gcc-version.txt 2>&1; then
            head -1 arc-gcc-version.txt
            echo "$HOME/arc/gnu-2026.03/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::the ARC toolchain does not run here; its tests skip"
          fi
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e ".[test,prove,dwarf]"
      - name: Tests
        # faulthandler_timeout: a test running over 300 s gets every thread's stack written to the log
        # (the slowest takes about 170 s there), so that a hang shows where it waits
        # -n auto: one worker per CPU of the runner (pytest-xdist; 2026-11-07, on the fast suite here: 12
        # workers 2.7 minutes against 7 to 11 in one process)
        run: .venv/bin/python -m pytest -q -rs --durations=10 -o faulthandler_timeout=300 -n auto
